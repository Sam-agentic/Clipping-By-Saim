<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner subtle border -->
  <rect x="28" y="28" width="456" height="456" rx="84" ry="84" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" />

  <!-- Corner accents - top-left -->
  <path d="M 16 96 L 16 16 L 96 16" fill="none" stroke="url(#cornerGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Corner accents - top-right -->
  <path d="M 416 16 L 496 16 L 496 96" fill="none" stroke="url(#cornerGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Corner accents - bottom-left -->
  <path d="M 16 416 L 16 496 L 96 496" fill="none" stroke="url(#cornerGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Corner accents - bottom-right -->
  <path d="M 416 496 L 496 496 L 496 416" fill="none" stroke="url(#cornerGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Decorative dots -->
  <circle cx="96" cy="96" r="6" fill="#ffffff" fill-opacity="0.4" />
  <circle cx="416" cy="96" r="6" fill="#ffffff" fill-opacity="0.4" />
  <circle cx="96" cy="416" r="6" fill="#ffffff" fill-opacity="0.4" />
  <circle cx="416" cy="416" r="6" fill="#ffffff" fill-opacity="0.4" />

  <!-- Stylish S letter -->
  <text x="256" y="330" font-family="Arial Black, Arial, sans-serif" font-size="300" font-weight="900" fill="url(#sGrad)" text-anchor="middle" filter="url(#glow)" style="letter-spacing:-8px">S</text>

  <!-- Play triangle accent inside S area -->
  <polygon points="256,190 296,230 256,270" fill="#22d3ee" fill-opacity="0.9" filter="url(#glow)" />

  <!-- Bottom text bar -->
  <rect x="120" y="400" width="272" height="6" rx="3" fill="#ffffff" fill-opacity="0.5" />
</svg>